[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# let-chains need 1.88; ratatui-image's sixel encoder (quantette, ordered-float) needs 1.90.
rust-version = "1.90"
authors = ["Sem <sem@noach.dev>"]
license = "GPL-3.0-only"
repository = "https://github.com/OseSem/hon"
homepage = "https://github.com/OseSem/hon"

[workspace.dependencies]
hon-core = { path = "crates/hon-core", version = "0.1.0" }
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
clap_mangen = "0.3.3"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
image = "0.25.10"
jiff = "0.2.38"
lopdf = "0.46.0"
mlua = { version = "0.12.3", features = ["luau", "async", "send", "serialize"] }
open = "5.4.5"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", features = ["crossterm", "image-defaults"], default-features = false }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "query", "form", "cookies"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
shlex = "2.0.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
toml = "1.1.8"
unicode-normalization = "0.1.26"
zip = { version = "9.2.1", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
wiremock = "0.6.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
# A panic in a spawned task must end hon: the panic hook has already restored the terminal.
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
