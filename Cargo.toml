[workspace]
members = ["crates/*"]
# hon-gui pulls in a whole GPU toolkit; plain `cargo build`/`test`/`clippy` (and CI's main job)
# skip it. Build it with `-p hon-gui`.
default-members = ["crates/hon-core", "crates/hon"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# let-chains need 1.88; ratatui-image's sixel encoder (quantette, ordered-float) needs 1.90.
rust-version = "1.90"
authors = ["Sem <sem@noach.dev>"]
license = "GPL-3.0-only"
repository = "https://github.com/OseSem/hon"
homepage = "https://github.com/OseSem/hon"

[workspace.dependencies]
hon-core = { path = "crates/hon-core", version = "0.1.0" }
hon = { path = "crates/hon", version = "0.1.0" }
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
clap_mangen = "0.3.3"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
ego-tree = "0.11.1"
futures = "0.3.34"
html5ever = "0.40.1"
iced = { version = "0.14.0", features = ["image"] }
image = "0.25.10"
jiff = "0.2.38"
lopdf = "0.46.0"
minisign-verify = "0.3.0"
mlua = { version = "0.12.3", features = ["luau", "async", "send", "serialize"] }
open = "5.4.5"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", features = ["crossterm", "image-defaults"], default-features = false }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "query", "form", "cookies"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
scraper = { version = "0.29.0", features = ["atomic"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-transcode = "1.1.1"
sha2 = "0.11.2"
shlex = "2.0.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
toml = "1.1.8"
unicode-normalization = "0.1.26"
zip = { version = "9.2.1", default-features = false, features = ["deflate"] }
minisign = "0.10.0"
tempfile = "3.27.0"
wiremock = "0.6.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
# No `panic = "abort"`: Luau raises a plugin's errors as C++ exceptions that unwind through
# mlua's Rust frames, and under abort every such error ends hon. A panic still ends hon:
# main's panic hook aborts.

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
