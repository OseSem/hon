[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "OseSem/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew", "./publish-crates", "./publish-aur"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Extra files to put in every archive
include = ["man/hon.1", "README.md", "LICENSE"]
# Extra steps before each build (NASM for Windows)
github-build-setup = "../build-setup.yml"
# The custom publish jobs only need to read the repo
github-custom-job-permissions = { "publish-crates" = { contents = "read" }, "publish-aur" = { contents = "read" } }
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

# Newest GitHub-hosted images (dist 0.32 still defaults to retired macOS 14).
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-26"
x86_64-apple-darwin = "macos-26-intel"
x86_64-pc-windows-msvc = "windows-2025"
x86_64-unknown-linux-musl = "ubuntu-24.04"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
