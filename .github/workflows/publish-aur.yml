# Called by release.yml (dist `publish-jobs`) after the GitHub Release exists.
# Pushes packaging/aur/PKGBUILD, with this release's version and checksums, to hon-bin.
name: Publish to the AUR

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    # Waits for approval by the environment's required reviewer.
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set version and checksums
        shell: bash
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          set -euo pipefail
          tag=$(jq -r .announcement_tag <<<"$PLAN")
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag"
          sum() { curl -fsSL "$base/hon-$1-unknown-linux-musl.tar.xz.sha256" | cut -d' ' -f1; }
          x86_64=$(sum x86_64)
          aarch64=$(sum aarch64)
          for s in "$x86_64" "$aarch64"; do
            [[ $s =~ ^[0-9a-f]{64}$ ]] || { echo "bad checksum: '$s'" >&2; exit 1; }
          done
          sed -i \
            -e "s/^pkgver=.*/pkgver=${tag#v}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$x86_64')/" \
            -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$aarch64')/" \
            packaging/aur/PKGBUILD
          cat packaging/aur/PKGBUILD
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: hon-bin
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: Sem
          commit_email: sem@noach.dev
          commit_message: Update to ${{ fromJson(inputs.plan).announcement_tag }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
